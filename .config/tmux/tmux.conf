#[Visual settings]
set -g status-position top
set -g status-style "bg=default,fg=#abb2bf"

set -g status-left "#[fg=#61afef]\uebc8 #S "
set -g status-right "#[fg=#5c6370] %H:%M | %d %b"

setw -g window-status-format "#[fg=#5c6370] #I:#W"
setw -g window-status-current-format "#[bold,fg=#98c379] [#I:#W]"

#[Tecnical settings]
unbind C-b
set -g prefix C-a
set -g base-index 1
setw -g pane-base-index 1

bind x kill-pane
bind & kill-window

bind H select-layout even-vertical
bind V select-layout even-horizontal

bind h select-pane -L
bind j select-pane -U
bind k select-pane -D
bind l select-pane -R

#[Reload config]
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded"

# Enable OSC 52 clipboard forwarding for remote Neovim yanks.
set -as terminal-features ",*:clipboard"
